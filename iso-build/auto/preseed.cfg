# ─── Preseed file for NovauOS automated install (optional) ────────────
#
# This is only used if the user boots with `priority=critical` or
# `auto=true`. By default we boot into the live environment and let
# the user run novau-installer from the welcome screen.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string novauos
d-i netcfg/get_domain string localdomain

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i time/zone string UTC

# Don't partition automatically — leave that to novau-installer
d-i partman-auto/init_automatically_partition select finish

# Account setup: skip; the user creates one via novau-installer
d-i passwd/root-login boolean false
d-i passwd/make-user boolean false

# Package selection: bare minimum; everything else comes from our Rust binaries
d-i pkgsel/include string openssh-server curl
d-i pkgsel/upgrade select none

d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean false
