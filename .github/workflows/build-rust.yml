# ─── NovauOS Rust component build ─────────────────────────────────────
#
# Builds every crate in rust-components/ on push & PR. Uploads binaries
# as workflow artifacts so the ISO build workflow can pick them up
# without rebuilding.
#
name: build-rust

on:
  push:
    branches: [main, develop]
    paths:
      - 'rust-components/**'
      - '.github/workflows/build-rust.yml'
  pull_request:
    paths:
      - 'rust-components/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: novau-rust-x86_64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: novau-rust-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libssl-dev libdbus-1-dev libsqlite3-dev \
            libwayland-dev libxkbcommon-dev \
            libpam0g-dev libudev-dev \
            libgtk-3-dev libpulse-dev \
            fonts-noto-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Install cross-compiler (aarch64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> $GITHUB_ENV

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-components/target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('rust-components/**/Cargo.toml', 'rust-components/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Format check
        working-directory: rust-components
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: rust-components
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true  # don't fail builds on clippy nits yet

      - name: Build (debug)
        working-directory: rust-components
        run: cargo build --workspace --target ${{ matrix.target }}

      - name: Build (release)
        working-directory: rust-components
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Run tests
        working-directory: rust-components
        run: cargo test --workspace --release --target ${{ matrix.target }} || true

      - name: Audit dependencies
        working-directory: rust-components
        run: |
          cargo install cargo-audit --locked || true
          cargo audit || true

      - name: Stage release binaries
        run: |
          mkdir -p artifacts/bin
          for crate in novau-greeter novau-panel novau-launcher novau-store novau-installer novau-settings novau-welcome; do
            src="rust-components/target/${{ matrix.target }}/release/${crate}"
            if [ -f "${src}" ]; then
              cp "${src}" "artifacts/bin/${crate}"
            fi
          done
          tar -czf artifacts/${{ matrix.artifact }}.tar.gz -C artifacts/bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
