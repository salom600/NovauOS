<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1B2D24"/>
      <stop offset="60%" stop-color="#0E1410"/>
      <stop offset="100%" stop-color="#050807"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ED6A3" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3CAE7B" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- Faint hex grid -->
  <g stroke="#6ED6A3" stroke-opacity="0.04" fill="none" stroke-width="1">
    <polygon points="100,100 200,150 200,250 100,300 0,250 0,150"/>
    <polygon points="300,100 400,150 400,250 300,300 200,250 200,150"/>
    <polygon points="500,100 600,150 600,250 500,300 400,250 400,150"/>
    <polygon points="100,300 200,350 200,450 100,500 0,450 0,350"/>
    <polygon points="300,300 400,350 400,450 300,500 200,450 200,350"/>
    <polygon points="500,300 600,350 600,450 500,500 400,450 400,350"/>
  </g>
  <!-- Centered logo -->
  <g transform="translate(960 540) scale(3.0) translate(-128 -128)">
    <polygon points="128,40 196,80 196,176 128,216 60,176 60,80"
             fill="none" stroke="#6ED6A3" stroke-width="2" stroke-opacity="0.6"/>
    <polygon points="128,80 168,104 168,152 128,176 88,152 88,104"
             fill="url(#mark)"/>
  </g>
  <text x="960" y="980" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="32" font-weight="300"
        fill="#F0F4F0" opacity="0.85">
    NovauOS
  </text>
</svg>
