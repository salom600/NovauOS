[workspace]
resolver = "2"
members = [
    "novau-greeter",
    "novau-panel",
    "novau-launcher",
    "novau-store",
    "novau-installer",
    "novau-settings",
    "novau-welcome",
    "novau-common",
    "novau-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["NovauOS Contributors"]
repository = "https://github.com/salom600/NovauOS"
homepage = "https://github.com/salom600/NovauOS"
rust-version = "1.86"

[workspace.dependencies]
# UI — iced 0.12's default features already include the winit backend
# (which picks up Wayland automatically on Linux). We add `tokio`,
# `svg`, and `image` for the features we actually use. Layer-shell
# support for the panel & launcher comes from the separate
# `iced_layershell` crate (added per-crate as needed).
iced = { version = "0.12", features = ["tokio", "svg", "image"] }

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# IPC
zbus = { version = "4", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"

# System
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
once_cell = "1"
parking_lot = "0.12"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Internal
novau-common = { path = "novau-common" }
novau-ipc = { path = "novau-ipc" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
debug = "line-tables-only"
